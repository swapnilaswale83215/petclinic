# Edge Routing Table — S3 Flip Artefact
# NEEDS CLARIFICATION: exact YAML schema and upstream reference syntax depend on
# the edge technology choice (research item 5a, resolved in E4-S6).
# Update field names and upstream syntax once the edge technology is confirmed.
#
# References: routing-table.md contract, FR-001, FR-012, AC-010, AC-013
# Transformation: split-petclinic-into-microserv-bbbd6b99
