    These define the guardrails you operate under.

    '
  scope: []
  level: blocking
  priority: 100
  source: base
- id: no-bypass-verify
  text: 'Never bypass verification: no --no-verify, no skip hooks, no disabling a failing test to make
    a build pass, no lint suppression for errors you introduced.

    '
  scope: []
  level: blocking
  priority: 100
  source: base
- id: no-force-push
  text: 'Never force-push, rebase a shared branch, amend a pushed commit, or run destructive git commands
    (reset --hard, clean -fdx) without being asked explicitly in this session.

    '
  scope: []
  level: blocking
  priority: 100
  source: base
- id: plan-first
  text: 'Before writing code: capture the request, ask every clarifying question at once, state your assumptions,
    and produce a plan. Commit the plan first and wait for human approval. Do not start implementing before
    that approval exists.

    '
  scope: []
  level: advisory
  priority: 80
  source: base
- id: tests-with-code
  text: 'Tests ship in the same change as the code they cover. Cover the happy path, at least one failure
    path, and any authorization boundary the change touches. Do not defer tests to a follow-up.

    '
  scope: []
  level: advisory
  priority: 70
  source: base
- id: scope-discipline
  text: 'Change only what the approved plan covers. If you discover that a fix requires touching a file
    outside the agreed scope, stop and say so rather than widening the change yourself.

    '
  scope: []
  level: advisory
  priority: 70
  source: base
- id: no-comments
  text: "Default to writing no comments. Only add one when the WHY is non-obvious. Do not explain WHAT\
    \ the code does \u2014 well-named identifiers already do that.\n"
  scope: []
  level: advisory
  priority: 40
  source: base
- id: git-commit-format
  text: "Every commit message must follow Conventional Commits: type(scope): short description \u2014\
    \ e.g. fix(auth): handle token expiry edge case. Valid types: feat, fix, refactor, test, docs, chore,\
    \ ci, perf, style. The message must reference the issue or ticket ID (e.g. \"Closes #123\" or \"PROJ-456\"\
    ). Never use vague messages like \"fix\", \"update\", or \"WIP\".\n"
  scope: []
  level: blocking
  priority: 90
  source: base
- id: git-branch-naming
  text: "Branch names must follow: type/issue-id-short-description \u2014 e.g. feat/PROJ-123-oauth-refresh.\
    \ Never commit directly to main or develop. All changes must go through a branch and a pull request.\
    \ Squash-merge is the default policy; linear history is required on main.\n"
  scope: []
  level: blocking
  priority: 90
  source: base
- id: git-pr-required
  text: "Every pull request description must include four sections: What changed, Why (business or technical\
    \ reason), How tested (manual steps or test names), and Risks and rollback plan. A PR without all\
    \ four sections must not be merged. The agent must never merge its own PR \u2014 a human reviewer\
    \ must approve first.\n"
  scope: []
  level: blocking
  priority: 90
  source: base
