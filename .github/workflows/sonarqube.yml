# This workflow runs SonarQube code quality analysis using Maven plugin
# For more information see: https://docs.sonarqube.org/latest/analyzing-source-code/scanners/sonarscanner-for-maven/

name: SonarQube Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for better analysis

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: maven

      - name: Build and SonarQube Analysis
        run: |
          ./mvnw -B clean verify \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.projectKey=petclinic \
            -Dsonar.projectName=PetClinic \
            sonar:sonar
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Display SonarQube Results
        if: always()
        run: |
          echo "SonarQube Analysis Complete!"
          echo "Dashboard: ${{ secrets.SONAR_HOST_URL }}/dashboard?id=petclinic"
