# This workflow runs SonarQube code quality analysis using SonarCloud
# For more information see: https://docs.sonarcloud.io/

name: SonarQube Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for better analysis

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'adopt'
          cache: maven

      - name: Build and SonarCloud Analysis
        run: |
          ./mvnw -B clean verify \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.organization=${{ secrets.SONAR_ORG }} \
            -Dsonar.projectKey=petclinic \
            sonar:sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Display SonarQube Results
        if: always()
        run: |
          echo "SonarQube Analysis Complete!"
          echo "Dashboard: https://sonarcloud.io/project/overview?id=petclinic"
