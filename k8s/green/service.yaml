apiVersion: v1
kind: Service
metadata:
  name: petclinic-green
  labels:
    app: petclinic
    slot: green
  annotations:
    platform/external-exposure: "none"
spec:
  type: ClusterIP
  selector:
    app: petclinic
    slot: green
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
